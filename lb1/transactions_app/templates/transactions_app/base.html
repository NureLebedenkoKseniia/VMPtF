<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Облік транзакцій та бюджету - ЛБ1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #8b5cf6;
            text-decoration: none;
        }
        nav a {
            color: #999;
            text-decoration: none;
            margin-left: 15px;
            font-weight: bold;
        }
        nav a:hover, nav a.active {
            color: #fff;
        }
        .btn {
            background: #8b5cf6;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            display: inline-block;
        }
        .btn:hover {
            background: #7c3aed;
        }
        .btn-danger {
            background: #ef4444;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .card {
            background: #222;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: #222;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #333;
            text-align: left;
        }
        th {
            background: #181818;
            color: #999;
        }
        .text-success { color: #10b981; }
        .text-danger { color: #ef4444; }
        footer {
            margin-top: 40px;
            border-top: 1px solid #333;
            padding-top: 15px;
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="{% url 'transaction_list' %}" class="logo">💰 Бюджетний Трекер</a>
            <nav>
                <a href="{% url 'transaction_list' %}" class="{% if request.resolver_match.url_name == 'transaction_list' %}active{% endif %}">Транзакції</a>
                <a href="{% url 'category_list' %}" class="{% if request.resolver_match.url_name == 'category_list' %}active{% endif %}">Категорії</a>
                <a href="{% url 'reports_dashboard' %}" class="{% if request.resolver_match.url_name == 'reports_dashboard' %}active{% endif %}">Бюджет та Звіти</a>
                <a href="/admin/" style="color: #9061f9;">Адмінка</a>
            </nav>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer>
            <div>Лебеденко Ксенія, ПЗПІ-23-9</div>
            <div>Варіант 6 (Транзакції та бюджет)</div>
        </footer>
    </div>
</body>
</html>
