{% extends 'transactions_app/base.html' %}

{% block content %}
<style>
    .form-card {
        max-width: 500px;
        margin: 30px auto;
        background: #181818;
        padding: 25px;
        border-radius: 8px;
        border: 1px solid #333;
    }
    .form-card h2 {
        margin-top: 0;
        border-bottom: 1px solid #333;
        padding-bottom: 10px;
    }
    .form-card form p {
        margin-bottom: 15px;
    }
    .form-card label {
        display: block;
        margin-bottom: 5px;
        color: #aaa;
        font-size: 14px;
    }
    .form-card input, .form-card textarea {
        width: 100%;
        padding: 8px 10px;
        background: #222;
        border: 1px solid #444;
        color: white;
        border-radius: 4px;
        box-sizing: border-box;
    }
</style>

<div class="form-card">
    <h2>Створити категорію</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button type="submit" class="btn" style="flex: 1;">Створити</button>
            <a href="{% url 'category_list' %}" class="btn" style="flex: 1; text-align: center; background: #333; color: white;">Скасувати</a>
        </div>
    </form>
</div>
{% endblock %}
